<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rustren Studio</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root {
      --bg-base: #0f0f11;
      --bg-panel: #18181b;
      --bg-header: #202024;
      --bg-hover: #27272c;
      --border: #2a2a30;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #e4e4e7;
      --text-muted: #8b8b96;
      --danger: #ef4444;
      --success: #22c55e;
      --keyframe: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      font-size: 12px;
    }
    header {
      height: 38px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span.title {
      font-weight: 700;
      font-size: 12px;
      color: var(--text-main);
      letter-spacing: 0.8px;
    }
    .file-badge {
      background: #121214;
      padding: 2px 7px;
      border-radius: 2px;
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats-badge {
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-right: 6px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: 1px solid transparent;
      padding: 4px 10px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.12s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: #27272c;
      border-color: #36363d;
      color: var(--text-main);
    }
    .btn-secondary:hover { background: #323238; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      min-height: 0;
      border-bottom: 1px solid var(--border);
    }
    .pane {
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: none; }
    .pane-header {
      height: 28px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
    }

    /* Left pane: layers */
    .layer-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      background: transparent;
      border-radius: 2px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .layer-item:hover { background: var(--bg-hover); }
    .layer-item.selected {
      background: #1e293b;
      border-color: var(--accent);
    }
    .layer-item .type-tag {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 4px;
      border-radius: 2px;
      background: #27272c;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
      min-width: 34px;
      text-align: center;
    }
    .layer-item .name {
      flex: 1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .layer-item .time {
      font-size: 10px;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
    }

    /* Center pane: viewport */
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #0a0a0c;
      position: relative;
    }
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      background-image:
        linear-gradient(45deg, #111114 25%, transparent 25%),
        linear-gradient(-45deg, #111114 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #111114 75%),
        linear-gradient(-45deg, transparent 75%, #111114 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }
    .canvas-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 1px solid #33333a;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
      background: #000;
    }
    .viewport-toolbar {
      height: 36px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
    }
    .control-btn {
      background: #222227;
      border: 1px solid #323238;
      color: var(--text-main);
      width: 28px;
      height: 24px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .control-btn:hover { background: #2f2f37; }
    .control-btn.play-btn {
      width: 36px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .control-btn.play-btn:hover { background: var(--accent-hover); }

    /* Right pane: variables */
    .variable-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .var-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .var-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .var-slider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .var-color {
      height: 24px;
      width: 100%;
      cursor: pointer;
      background: #121214;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1px;
    }

    /* Bottom pane: Timeline */
    footer.timeline {
      height: 156px;
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
    }
    .timeline-ruler-wrap {
      height: 28px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .timecode {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      color: #60a5fa;
      min-width: 118px;
    }
    .ruler {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .scrubber-slider {
      width: 100%;
      accent-color: var(--danger);
      cursor: pointer;
    }
    .timeline-tracks {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-lane {
      height: 20px;
      background: #121215;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      border: 1px solid #242429;
    }
    .track-block {
      position: absolute;
      top: 1px;
      bottom: 1px;
      background: #2563eb;
      border-radius: 1px;
      font-size: 10px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 500;
      opacity: 0.88;
    }
    .track-block.text { background: #7c3aed; }
    .track-block.rect { background: #d97706; }
    .track-block.circle { background: #0891b2; }
    .track-block.image { background: #db2777; }
    .track-block.video { background: #059669; }

    .status-pill {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 6px;
    }
    .status-pill.error { background: var(--danger); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/logo.png" width="20" height="20" alt="Rustren" style="border-radius: 3px;" />
      <span class="title">RUSTREN STUDIO</span>
      <span class="file-badge" id="scenePath">Scene Loaded</span>
    </div>
    <div class="header-actions">
      <span class="stats-badge" id="renderStats">Connecting...</span>
      <button class="btn btn-secondary" id="snapBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        Snapshot PNG
      </button>
      <button class="btn" id="exportBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Render MP4
      </button>
    </div>
  </header>

  <main>
    <div class="pane">
      <div class="pane-header">
        <span>Layers</span>
        <span id="layerCount">0</span>
      </div>
      <div class="layer-list" id="layerList"></div>
    </div>

    <div class="viewport">
      <div class="canvas-container">
        <img id="previewImg" alt="Rustren Viewport" />
      </div>
      <div class="viewport-toolbar">
        <button class="control-btn" id="btnStart" title="Jump to start">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn" id="btnPrev" title="Previous frame">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="control-btn play-btn" id="btnPlay" title="Play / Pause (Space)">
          <svg id="playIcon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" id="btnNext" title="Next frame">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
        <button class="control-btn" id="btnEnd" title="Jump to end">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>Properties &amp; Variables</span>
      </div>
      <div class="variable-list" id="varList">
        <div style="font-size: 11px; color: var(--text-muted);">No dynamic variables found in scene.</div>
      </div>
    </div>
  </main>

  <footer class="timeline">
    <div class="timeline-ruler-wrap">
      <div class="timecode" id="timecodeDisplay">00:00.00 / 00:00.00</div>
      <div class="ruler">
        <input type="range" class="scrubber-slider" id="scrubber" min="0" max="5" step="0.0166" value="0" />
      </div>
    </div>
    <div class="timeline-tracks" id="timelineTracks"></div>
  </footer>

  <script>
    let ws = null;
    let playing = false;
    let playTimer = null;
    let lastBlobUrl = null;
    let currentScene = null;
    let selectedLayerIdx = 0;
    let activeVariables = {};
    let duration = 5.0;
    let fps = 30;

    const previewImg = document.getElementById("previewImg");
    const scrubber = document.getElementById("scrubber");
    const timecodeDisplay = document.getElementById("timecodeDisplay");
    const renderStats = document.getElementById("renderStats");
    const btnPlay = document.getElementById("btnPlay");
    const playIcon = document.getElementById("playIcon");
    const btnStart = document.getElementById("btnStart");
    const btnEnd = document.getElementById("btnEnd");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const snapBtn = document.getElementById("snapBtn");
    const exportBtn = document.getElementById("exportBtn");
    const layerList = document.getElementById("layerList");
    const layerCount = document.getElementById("layerCount");
    const timelineTracks = document.getElementById("timelineTracks");
    const varList = document.getElementById("varList");
    const scenePath = document.getElementById("scenePath");

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function updateTimeDisplay() {
      const t = parseFloat(scrubber.value) || 0;
      timecodeDisplay.textContent = `${formatTime(t)} / ${formatTime(duration)}`;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.binaryType = "blob";

      ws.onopen = () => {
        renderStats.innerHTML = `<span class="status-pill"></span>Connected`;
        requestInitialScene();
      };

      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") {
          try {
            const data = JSON.parse(ev.data);
            if (data.type === "init") {
              initScene(data.scene, data.path, data.variables);
            } else if (data.type === "stats") {
              renderStats.innerHTML = `<span class="status-pill"></span>${data.width}x${data.height} | ${data.ms.toFixed(1)}ms`;
            } else if (data.type === "export_done") {
              renderStats.innerHTML = `<span class="status-pill"></span>Exported: ${data.path}`;
              alert(`Render MP4 selesai: ${data.path}`);
            } else if (data.error) {
              renderStats.innerHTML = `<span class="status-pill error"></span>${data.error}`;
            }
          } catch (e) { console.error(e); }
        } else {
          if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
          lastBlobUrl = URL.createObjectURL(ev.data);
          previewImg.src = lastBlobUrl;
        }
      };

      ws.onclose = () => {
        renderStats.innerHTML = `<span class="status-pill error"></span>Disconnected — retrying...`;
        setTimeout(connect, 1000);
      };
    }

    function requestInitialScene() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: "get_scene" }));
      }
    }

    function initScene(scene, path, variables) {
      currentScene = scene;
      if (path) scenePath.textContent = path;
      if (scene.canvas) {
        duration = scene.canvas.duration_secs || 5.0;
        fps = scene.canvas.fps || 30;
      }
      scrubber.max = duration;
      scrubber.step = 1.0 / fps;
      updateTimeDisplay();
      renderLayers(scene.layers || []);
      renderTimelineBlocks(scene.layers || []);
      renderVariables(variables || []);
      renderFrame();
    }

    function renderLayers(layers) {
      layerList.innerHTML = "";
      layerCount.textContent = `${layers.length}`;
      layers.forEach((l, idx) => {
        const item = document.createElement("div");
        item.className = "layer-item" + (idx === selectedLayerIdx ? " selected" : "");
        const start = l.start_sec || 0;
        const dur = l.duration_secs || duration;
        item.innerHTML = `
          <span class="type-tag">${(l.type || "box").slice(0, 4)}</span>
          <span class="name">${l.name || l.id || l.type + ' #' + (idx + 1)}</span>
          <span class="time">${start.toFixed(1)}s</span>
        `;
        item.onclick = () => {
          selectedLayerIdx = idx;
          document.querySelectorAll(".layer-item").forEach((el, i) => {
            el.classList.toggle("selected", i === idx);
          });
          scrubber.value = start;
          updateTimeDisplay();
          renderFrame();
        };
        layerList.appendChild(item);
      });
    }

    function renderTimelineBlocks(layers) {
      timelineTracks.innerHTML = "";
      layers.forEach((l, idx) => {
        const lane = document.createElement("div");
        lane.className = "track-lane";
        const start = l.start_sec || 0;
        const dur = l.duration_secs || (duration - start);
        const leftPercent = (start / duration) * 100;
        const widthPercent = (dur / duration) * 100;

        const block = document.createElement("div");
        block.className = `track-block ${l.type || ''}`;
        block.style.left = `${leftPercent}%`;
        block.style.width = `${widthPercent}%`;
        block.textContent = l.name || l.id || `${l.type || 'layer'} #${idx + 1}`;
        lane.appendChild(block);

        if (Array.isArray(l.animations)) {
          l.animations.forEach((a) => {
            [a.start_sec, a.end_sec].forEach((kt) => {
              if (typeof kt !== "number") return;
              const pct = Math.min(100, Math.max(0, (kt / duration) * 100));
              const kf = document.createElement("span");
              kf.textContent = "◆";
              kf.title = `Keyframe @ ${kt.toFixed(2)}s`;
              kf.style.cssText = `position:absolute;left:${pct}%;top:50%;transform:translate(-50%,-50%);color:var(--keyframe);font-size:11px;cursor:pointer;z-index:2;text-shadow:0 0 3px #000;`;
              kf.onclick = (ev) => {
                ev.stopPropagation();
                scrubber.value = kt;
                updateTimeDisplay();
                renderFrame();
              };
              lane.appendChild(kf);
            });
          });
        }
        timelineTracks.appendChild(lane);
      });
    }

    function renderVariables(variables) {
      varList.innerHTML = "";
      if (!variables || variables.length === 0) {
        varList.innerHTML = `<div style="font-size: 11px; color: var(--text-muted);">No dynamic variables found in scene.</div>`;
        return;
      }
      variables.forEach((v) => {
        if (v.id && v.default !== undefined && activeVariables[v.id] === undefined) {
          activeVariables[v.id] = v.default;
        }
        const group = document.createElement("div");
        group.className = "var-group";
        const label = document.createElement("div");
        label.className = "var-label";
        label.innerHTML = `<span>${v.label || v.id}</span><span id="val_${v.id}">${v.default}</span>`;
        group.appendChild(label);

        if (v.type === "number") {
          const slider = document.createElement("input");
          slider.type = "range";
          slider.className = "var-slider";
          slider.min = v.min !== undefined ? v.min : 0;
          slider.max = v.max !== undefined ? v.max : 100;
          slider.step = v.step !== undefined ? v.step : 1;
          slider.value = v.default;
          slider.oninput = (e) => {
            document.getElementById(`val_${v.id}`).textContent = e.target.value;
            activeVariables[v.id] = parseFloat(e.target.value);
            renderFrame();
          };
          group.appendChild(slider);
        } else if (v.type === "color") {
          const colorInput = document.createElement("input");
          colorInput.type = "color";
          colorInput.className = "var-color";
          colorInput.value = v.default || "#ffffff";
          colorInput.oninput = (e) => {
            document.getElementById(`val_${v.id}`).textContent = e.target.value;
            activeVariables[v.id] = e.target.value;
            renderFrame();
          };
          group.appendChild(colorInput);
        }
        varList.appendChild(group);
      });
    }

    function renderFrame() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const t = parseFloat(scrubber.value) || 0;
      updateTimeDisplay();
      ws.send(JSON.stringify({ action: "render_frame", t: t, variables: activeVariables }));
    }

    scrubber.addEventListener("input", () => {
      if (playing) togglePlay();
      renderFrame();
    });

    function togglePlay() {
      playing = !playing;
      playIcon.innerHTML = playing
        ? `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`
        : `<path d="M8 5v14l11-7z"/>`;
      if (playing) {
        const frameInterval = 1000 / fps;
        playTimer = setInterval(() => {
          let t = parseFloat(scrubber.value) + (1.0 / fps);
          if (t >= duration) t = 0;
          scrubber.value = t;
          renderFrame();
        }, frameInterval);
      } else {
        clearInterval(playTimer);
      }
    }

    btnPlay.addEventListener("click", togglePlay);
    btnStart.addEventListener("click", () => { scrubber.value = 0; renderFrame(); });
    btnEnd.addEventListener("click", () => { scrubber.value = duration; renderFrame(); });
    btnPrev.addEventListener("click", () => {
      scrubber.value = Math.max(0, parseFloat(scrubber.value) - (1.0 / fps));
      renderFrame();
    });
    btnNext.addEventListener("click", () => {
      scrubber.value = Math.min(duration, parseFloat(scrubber.value) + (1.0 / fps));
      renderFrame();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowLeft") {
        scrubber.value = Math.max(0, parseFloat(scrubber.value) - (1.0 / fps));
        renderFrame();
      } else if (e.code === "ArrowRight") {
        scrubber.value = Math.min(duration, parseFloat(scrubber.value) + (1.0 / fps));
        renderFrame();
      }
    });

    snapBtn.addEventListener("click", () => {
      if (!previewImg.src) return;
      const a = document.createElement("a");
      a.href = previewImg.src;
      a.download = `rustren_frame_${parseFloat(scrubber.value).toFixed(2)}s.png`;
      a.click();
    });

    exportBtn.addEventListener("click", () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        renderStats.innerHTML = `<span class="status-pill"></span>Exporting MP4...`;
        ws.send(JSON.stringify({ action: "export_mp4", variables: activeVariables }));
      }
    });

    const dropOverlay = document.createElement("div");
    dropOverlay.style.cssText = "position:fixed;inset:0;background:rgba(37,99,235,0.18);border:2px dashed #3b82f6;z-index:9999;display:none;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;pointer-events:none;backdrop-filter:blur(3px);";
    dropOverlay.textContent = "Drop .json or .html scene file to load";
    document.body.appendChild(dropOverlay);

    window.addEventListener("dragover", (e) => { e.preventDefault(); dropOverlay.style.display = "flex"; });
    window.addEventListener("dragleave", (e) => { if (e.relatedTarget === null) dropOverlay.style.display = "none"; });
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      dropOverlay.style.display = "none";
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          activeVariables = {};
          scrubber.value = 0;
          ws.send(JSON.stringify({ action: "load_file", filename: file.name, content: reader.result }));
        }
      };
      reader.readAsText(file);
    });

    let isDraggingCanvas = false;
    let dragStartX = 0;
    let dragStartY = 0;
    previewImg.style.cursor = "grab";
    previewImg.addEventListener("mousedown", (e) => {
      e.preventDefault();
      isDraggingCanvas = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      previewImg.style.cursor = "grabbing";
    });
    window.addEventListener("mousemove", (e) => {
      if (!isDraggingCanvas || !currentScene || !currentScene.canvas) return;
      const rect = previewImg.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const scaleX = currentScene.canvas.width / rect.width;
      const scaleY = currentScene.canvas.height / rect.height;
      const dx = (e.clientX - dragStartX) * scaleX;
      const dy = (e.clientY - dragStartY) * scaleY;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (e.shiftKey) {
          ws.send(JSON.stringify({ action: "transform_layer", layer_index: selectedLayerIdx, drot: (e.clientX - dragStartX) * 0.5 }));
        } else {
          ws.send(JSON.stringify({ action: "move_layer", layer_index: selectedLayerIdx, dx: dx, dy: dy }));
        }
        renderFrame();
      }
    });
    previewImg.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (ws && ws.readyState === WebSocket.OPEN) {
        const ds = e.deltaY < 0 ? 0.05 : -0.05;
        ws.send(JSON.stringify({ action: "transform_layer", layer_index: selectedLayerIdx, ds: ds }));
        renderFrame();
      }
    }, { passive: false });
    window.addEventListener("mouseup", () => {
      if (isDraggingCanvas) {
        isDraggingCanvas = false;
        previewImg.style.cursor = "grab";
      }
    });

    connect();
  </script>
</body>
</html>
