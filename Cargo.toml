[package]
name = "rustren"
version = "0.3.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Browserless 2.5D Video Render Engine in Rust"
repository = "https://github.com/sharriffajar/rustren"
readme = "README.md"
keywords = ["video", "render", "2d", "json", "ffmpeg"]
categories = ["multimedia::video", "command-line-utilities"]
exclude = [
    "assets/showreel.mp4",
    "assets/showreel_sheet.png",
    "assets/logo.png",
    "examples/",
    "scripts/",
    "sdk/",
]

[features]
default = ["pro"]
pro = ["dep:axum", "dep:subtle", "dep:tokio", "dep:uuid"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cosmic-text = "0.12"
image = "0.25"
notify = "6.1"
rayon = "1.10"
resvg = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
taffy = "0.7"
tiny-skia = "0.11"
ureq = "2.10"
axum = { version = "0.7", features = ["ws"], optional = true }
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
evalexpr = "13.1.0"
fast_image_resize = "5"
scraper = "0.20"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
