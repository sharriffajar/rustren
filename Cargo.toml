[package]
name = "rustren"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Browserless 2D Video Render Engine in Rust"
repository = "https://github.com/sharriffajar/rustren"
readme = "README.md"
keywords = ["video", "render", "2d", "json", "ffmpeg"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cosmic-text = "0.12"
image = "0.25"
notify = "6.1"
rayon = "1.10"
resvg = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
taffy = "0.7"
tiny-skia = "0.11"
ureq = "2.10"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
evalexpr = "13.1.0"
scraper = "0.20"

[profile.dev.package."*"]
opt-level = 3
