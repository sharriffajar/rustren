<scene width="1920" height="1080" duration="6.0" background="#ffffff">
  <!-- Clean Geometric Flowchart (blocks/flowchart canonical) -->
  <!-- Header / Badge -->
  <container id="flow-header" x="100" y="80" direction="column" gap="8">
    <text text="HYPERFRAMES 2D BLOCK · 1:1 CANONICAL" font-size="14" font-weight="700" color="#6b7280" letter-spacing="2" />
    <text text="Clean Geometric Flowchart (flowchart)" font-size="44" font-weight="700" color="#111827" max-width="1400" />
    <text text="Crisp orthogonal connectors, rounded rectangle cards, and interactive cursor sequence." font-size="18" color="#4b5563" max-width="1400" />
  </container>

  <!-- Connectors SVG (Level 1 -> 2, Level 2 -> 3) -->
  <!-- Level 1 Root (960, 270), Level 2 Yes (600, 470), Not sure (1320, 470) -->
  <!-- Level 3 Python (400, 670), NoCode (800, 670), Website (1120, 670), Course (1520, 670) -->
  <svg x="0" y="0" width="1920" height="1080">
    <!-- Level 1 to 2 -->
    <path d="M 960 310 L 960 390 L 600 390 L 600 430" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="800" stroke-dashoffset="0" />
    <path d="M 960 310 L 960 390 L 1320 390 L 1320 430" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="800" stroke-dashoffset="0" />

    <!-- Level 2 to 3 -->
    <path d="M 600 510 L 600 590 L 400 590 L 400 630" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="800" stroke-dashoffset="0" />
    <path d="M 600 510 L 600 590 L 800 590 L 800 630" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="800" stroke-dashoffset="0" />
    <path d="M 1320 510 L 1320 590 L 1120 590 L 1120 630" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="800" stroke-dashoffset="0" />
    <path d="M 1320 510 L 1320 590 L 1520 590 L 1520 630" fill="none" stroke="#333333" stroke-width="4" stroke-dasharray="800" stroke-dashoffset="0" />
  </svg>

  <!-- Labels on Connectors -->
  <container id="lbl-yes" x="760" y="375" background="#ffffff" border-radius="4" padding="4 10" align-items="center" justify-content="center">
    <text text="Yes" font-size="14" font-weight="700" color="#333333" />
  </container>
  <container id="lbl-not-sure" x="1100" y="375" background="#ffffff" border-radius="4" padding="4 10" align-items="center" justify-content="center">
    <text text="Not sure" font-size="14" font-weight="700" color="#333333" />
  </container>

  <!-- Level 1: Root Node (Yellow: #e8d44d) -->
  <container id="node-root" x="800" y="240" width="320" height="70" background="#e8d44d" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Should I learn to code?" font-size="19" font-weight="700" color="#222222" />
  </container>

  <!-- Level 2: Child Nodes (Green: #c2e8a0, Peach: #f5c5a3) -->
  <container id="node-yes" x="510" y="440" width="180" height="64" background="#c2e8a0" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Yes" font-size="20" font-weight="700" color="#222222" />
  </container>
  <container id="node-not-sure" x="1220" y="440" width="200" height="64" background="#f5c5a3" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Not sure" font-size="20" font-weight="700" color="#222222" />
  </container>

  <!-- Level 3: Leaf Nodes -->
  <!-- Python (Lavender: #d4c5f9) -->
  <container id="node-python" x="290" y="640" width="220" height="64" background="#d4c5f9" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Start with Python" font-size="18" font-weight="700" color="#222222" />
  </container>
  <!-- NoCode (Blue: #a8d8f0) -->
  <container id="node-nocode" x="690" y="640" width="220" height="64" background="#a8d8f0" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Try no-code first" font-size="18" font-weight="700" color="#222222" />
  </container>
  <!-- Website (Pink: #f8b4c8) -->
  <container id="node-website" x="1000" y="640" width="240" height="64" background="#f8b4c8" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Build a website" font-size="18" font-weight="700" color="#222222" />
  </container>
  <!-- Free Course (Yellow: #e8d44d) -->
  <container id="node-course" x="1400" y="640" width="240" height="64" background="#e8d44d" border-radius="12" align-items="center" justify-content="center" shadow="0 4 12 rgba(0,0,0,0.1)">
    <text text="Take a free course" font-size="18" font-weight="700" color="#222222" />
  </container>

  <!-- Interactive Cursor Indicator -->
  <container id="cursor-widget" x="480" y="690" direction="row" gap="8" align-items="center">
    <svg width="24" height="24" viewBox="0 0 24 24">
      <path d="M5.65 12.36 L0.5 16.88 L0.5 1.2 L11.78 12.36 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </svg>
    <container background="#2563eb" border-radius="4" padding="2 8">
      <text text="You" font-size="12" font-weight="700" color="#ffffff" />
    </container>
  </container>
</scene>
