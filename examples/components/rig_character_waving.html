<!-- Modular Rig Kit: Waving Character (IncludeLayer + nested ContainerLayer with pivot_x/pivot_y) -->
<!-- Usage: <include src="components/rig_character_waving.html" x="240" y="320" hoodie="#3B82F6" skin="#FCD5B5" /> -->
<container x="{{x|240}}" y="{{y|320}}" width="220" height="280" position="absolute">
  <!-- Torso / Hoodie -->
  <rect x="60" y="130" width="100" height="120" radius="28" color="{{hoodie|#3B82F6}}" position="absolute" />

  <!-- Right Arm pivoting from shoulder joint (pivot-x=0.15, pivot-y=0.2) -->
  <container x="148" y="142" width="90" height="32" pivot-x="0.15" pivot-y="0.5" position="absolute">
    <animate prop="rotation" from="-35" to="15" start="0" end="4" expr="-25 + 28 * sin(t * 6.0)" />
    <rect x="0" y="4" width="72" height="24" radius="12" color="{{hoodie|#3B82F6}}" position="absolute" />
    <circle cx="76" cy="16" r="14" color="{{skin|#FCD5B5}}" position="absolute" />
  </container>

  <!-- Head container pivoting from neck (pivot-x=0.5, pivot-y=0.95) -->
  <container x="55" y="20" width="110" height="110" pivot-x="0.5" pivot-y="0.95" position="absolute">
    <animate prop="rotation" from="-4" to="4" start="0" end="4" expr="4 * sin(t * 2.2)" />
    <circle cx="55" cy="55" r="52" color="radial-gradient(circle at 35% 30%, {{skin|#FCD5B5}}, #E5B28A)" position="absolute" />
    <!-- Eyes with periodic blink via scale_y -->
    <circle cx="38" cy="50" r="6" color="#1E293B" position="absolute">
      <animate prop="scale_y" from="1" to="1" start="0" end="4" expr="if(sin(t * 2.3) > 0.96, 0.12, 1.0)" />
    </circle>
    <circle cx="72" cy="50" r="6" color="#1E293B" position="absolute">
      <animate prop="scale_y" from="1" to="1" start="0" end="4" expr="if(sin(t * 2.3) > 0.96, 0.12, 1.0)" />
    </circle>
    <!-- Smile -->
    <rect x="42" y="72" width="26" height="6" radius="3" color="#9A3412" position="absolute" />
  </container>
</container>
