<scene width="1080" height="1350" fps="30" duration="5.0" background="#ffffff">
  <!-- Clean background -->
  <rect x="0" y="0" width="1080" height="1350" color="#ffffff" />

  <!-- Stage Container -->
  <container position="absolute" x="72" y="64" width="936" height="1220" layout="column">
    
    <!-- Header -->
    <text text="ACME / WEEK IN MERGES" font-size="13" font-weight="600" color="#666666" letter-spacing="2.0" />
    <text text="Pull requests merged this week" font-size="48" font-weight="700" color="#141414" letter-spacing="-0.5" margin-top="14" />
    
    <container layout="row" justify-content="space_between" align-items="center" width="936" margin-top="12">
      <text text="1 September - 7 September 2026 · America/Los_Angeles" font-size="18" color="#777777" />
      <text text="26 PRs" font-size="22" font-weight="700" color="#141414" />
    </container>

    <!-- Divider -->
    <rect width="936" height="1" color="#e5e5e5" margin-top="24" />

    <!-- Rows Section: Ada (12), Bao (7), Cam (4), Dee (2), Eli (1) -->
    <container layout="column" gap="32" margin-top="40" width="936">
      
      <!-- Row 1: Ada (Lead 12 PRs) -->
      <container layout="row" align-items="center" width="936">
        <container width="240" layout="column">
          <text text="Ada" font-size="34" font-weight="700" color="#141414" />
          <text text="12 merges" font-size="16" color="#777777" margin-top="4" />
        </container>
        <!-- Bar Lane -->
        <container width="696" height="56" background="#f4f4f5" border-radius="28" justify-content="center" padding="4">
          <container width="688" height="48" background="#18181b" border-radius="24" layout="row" align-items="center" padding="8">
            <animate property="width" from="48" to="688" start="0.2" end="1.0" easing="ease_out" />
            <container width="32" height="32" background="#3b82f6" border-radius="16" align-items="center" justify-content="center">
              <text text="A" font-size="14" font-weight="bold" color="#ffffff" />
            </container>
          </container>
        </container>
      </container>

      <!-- Row 2: Bao (7 PRs) -->
      <container layout="row" align-items="center" width="936">
        <container width="240" layout="column">
          <text text="Bao" font-size="34" font-weight="700" color="#141414" />
          <text text="7 merges" font-size="16" color="#777777" margin-top="4" />
        </container>
        <!-- Bar Lane -->
        <container width="696" height="56" background="#f4f4f5" border-radius="28" justify-content="center" padding="4">
          <container width="420" height="48" background="#27272a" border-radius="24" layout="row" align-items="center" padding="8">
            <animate property="width" from="48" to="420" start="0.4" end="1.2" easing="ease_out" />
            <container width="32" height="32" background="#10b981" border-radius="16" align-items="center" justify-content="center">
              <text text="B" font-size="14" font-weight="bold" color="#ffffff" />
            </container>
          </container>
        </container>
      </container>

      <!-- Row 3: Cam (4 PRs) -->
      <container layout="row" align-items="center" width="936">
        <container width="240" layout="column">
          <text text="Cam" font-size="34" font-weight="700" color="#141414" />
          <text text="4 merges" font-size="16" color="#777777" margin-top="4" />
        </container>
        <!-- Bar Lane -->
        <container width="696" height="56" background="#f4f4f5" border-radius="28" justify-content="center" padding="4">
          <container width="260" height="48" background="#3f3f46" border-radius="24" layout="row" align-items="center" padding="8">
            <animate property="width" from="48" to="260" start="0.6" end="1.4" easing="ease_out" />
            <container width="32" height="32" background="#f59e0b" border-radius="16" align-items="center" justify-content="center">
              <text text="C" font-size="14" font-weight="bold" color="#ffffff" />
            </container>
          </container>
        </container>
      </container>

      <!-- Row 4: Dee (2 PRs) -->
      <container layout="row" align-items="center" width="936">
        <container width="240" layout="column">
          <text text="Dee" font-size="34" font-weight="700" color="#141414" />
          <text text="2 merges" font-size="16" color="#777777" margin-top="4" />
        </container>
        <!-- Bar Lane -->
        <container width="696" height="56" background="#f4f4f5" border-radius="28" justify-content="center" padding="4">
          <container width="150" height="48" background="#52525b" border-radius="24" layout="row" align-items="center" padding="8">
            <animate property="width" from="48" to="150" start="0.8" end="1.6" easing="ease_out" />
            <container width="32" height="32" background="#8b5cf6" border-radius="16" align-items="center" justify-content="center">
              <text text="D" font-size="14" font-weight="bold" color="#ffffff" />
            </container>
          </container>
        </container>
      </container>

      <!-- Row 5: Eli (1 PR) -->
      <container layout="row" align-items="center" width="936">
        <container width="240" layout="column">
          <text text="Eli" font-size="34" font-weight="700" color="#141414" />
          <text text="1 merge" font-size="16" color="#777777" margin-top="4" />
        </container>
        <!-- Bar Lane -->
        <container width="696" height="56" background="#f4f4f5" border-radius="28" justify-content="center" padding="4">
          <container width="90" height="48" background="#71717a" border-radius="24" layout="row" align-items="center" padding="8">
            <animate property="width" from="48" to="90" start="1.0" end="1.8" easing="ease_out" />
            <container width="32" height="32" background="#ec4899" border-radius="16" align-items="center" justify-content="center">
              <text text="E" font-size="14" font-weight="bold" color="#ffffff" />
            </container>
          </container>
        </container>
      </container>

    </container>

    <!-- Footer Rules & Info -->
    <rect width="936" height="1" color="#e5e5e5" margin-top="60" />
    <container layout="row" justify-content="space_between" width="936" margin-top="20">
      <text text="Speed proportional to merges · By PR author" font-size="15" color="#777777" />
      <text text="Example org · 1 repo · Bots · 0" font-size="15" color="#999999" />
    </container>

  </container>
</scene>
