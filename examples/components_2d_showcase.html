<!--
  Rustren 2D Components Showcase
  Menggabungkan:
    1. Bar Chart dengan Dynamic Counter & Animated Bars
    2. Code Diff dengan Syntax Diff & Typewriter
    3. Dart Cursor dengan Animated Trajectory & Click Ripple
    4. Touch Indicator Mobile Tap Ripple
-->
<scene width="1920" height="1080" fps="30" duration="3.0" background="#05070D">
    <!-- Ambient background glow circles -->
    <circle cx="480" cy="540" r="320" color="#0B132B" glow="80" glow-color="#1E293B" glow-intensity="1.2" />
    <circle cx="1440" cy="540" r="320" color="#0B132B" glow="80" glow-color="#1E293B" glow-intensity="1.2" />

    <!-- Title Header -->
    <text x="960" y="80" text-align="center" font-size="44" font-weight="bold" color="#F8FAFC" glow="20" glow-color="#38BDF8">
        RUSTREN 2D ENGINE CAPABILITIES
    </text>
    <text x="960" y="130" text-align="center" font-size="22" color="#94A3B8" typewriter="true" typewriter-start="0.1" typewriter-end="1.5" cursor="▍">
        Modular Declarative Components adapted from HyperFrames Catalog
    </text>

    <!-- Component 1: Animated Bar Chart (Left Side) -->
    <include
        src="components/bar_chart.html"
        x="120"
        y="200"
        title="CORE PERFORMANCE"
        val1="98"
        val2="85"
        val3="92"
        bar1_color="#38BDF8"
        bar2_color="#34D399"
        bar3_color="#A855F7"
    />

    <!-- Component 2: Code Diff (Right Side) -->
    <include
        src="components/code_diff.html"
        x="980"
        y="200"
        filename="src/renderer.rs (Performance Patch)"
    />

    <!-- Component 3: Dart Cursor with motion path and click at the bar chart -->
    <include
        src="components/dart_cursor.html"
        x="400"
        y="300"
        cursor_color="#FFFFFF"
        outline_color="#0F172A"
        accent="#38BDF8"
    >
        <animate property="x" from="1000" to="400" start="0.0" end="0.7" easing="ease_out" />
        <animate property="y" from="800" to="300" start="0.0" end="0.7" easing="ease_out" />
    </include>

    <!-- Component 4: Touch Indicator tap at bottom status -->
    <include
        src="components/touch_indicator.html"
        x="960"
        y="850"
        ring_color="#38BDF8"
    >
        <animate property="opacity" from="0" to="1" start="1.5" end="1.6" />
    </include>
    <text x="960" y="930" text-align="center" font-size="20" color="#64748B">
        100% Native Pure-Rust Rendering • Zero Browser / Headless Overhead
    </text>
</scene>
