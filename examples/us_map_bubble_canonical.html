<scene width="1920" height="1080" fps="30" duration="5.0" background="#0f172a">
  <!-- Gradient Background matching original HyperFrames block -->
  <container position="absolute" x="0" y="0" width="1920" height="1080" background="linear-gradient(145deg, #0f172a, #1e293b)" />

  <!-- Canonical Header -->
  <container position="absolute" x="260" y="70" width="1400" height="120" layout="column" align-items="center">
    <text text="TOP US CITIES BY POPULATION" font-size="16" font-weight="700" color="#38bdf8" letter-spacing="3.0" opacity="0.9" />
    <text text="Proportional Metropolitan Bubble Distribution" font-size="46" font-weight="700" color="#f8fafc" letter-spacing="-0.5" margin-top="4" />

  </container>

  <!-- US Continental Outline & Boundary Guides (SVG) -->
  <svg x="100" y="200" width="1720" height="660" viewBox="0 0 1720 660" fill="none">
    <!-- Simplified stylized continental boundary -->
    <path d="M 60 40 L 400 40 L 800 60 L 1150 50 L 1450 180 L 1400 320 L 1280 580 L 980 560 L 680 570 L 450 490 L 180 500 L 70 340 Z"

      <container position="absolute" x="0" y="0" width="64" height="64" align-items="center" justify-content="center">
        <circle r="22" color="#06b6d4" opacity="0.2">
          <animate property="scale" from="0.8" to="1.4" start="0.2" end="1.8" repeat="true" yoyo="true" easing="ease_in_out" />
        </circle>
      </container>
      <container position="absolute" x="0" y="0" width="64" height="64" align-items="center" justify-content="center">
        <circle r="10" color="#06b6d4" />
      </container>
    </container>
    <text font-size="12" font-weight="bold" color="#cbd5e1" align="center">Seattle (0.75M)</text>
