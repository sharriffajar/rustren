<scene width="1920" height="1080" fps="30" duration="5.0" background="#05070b">
  <!-- Dark Stage Background -->
  <rect x="0" y="0" width="1920" height="1080" color="#05070b" />

  <!-- Canonical Header matching HyperFrames specs -->
  <container position="absolute" x="200" y="90" width="1520" layout="column">
    <text text="PERFORMANCE & METRICS · HYPERFRAMES COMPONENT" font-size="14" font-weight="600" color="#71f5a7" letter-spacing="3.0" opacity="0.9" />
    <text text="Chart Story · Quarterly Data Progression" font-size="44" font-weight="700" color="#f8fafc" letter-spacing="-0.5" margin-top="6" />
    <text text="Dynamic staggered bar build, baseline draw, and emphasized target callout." font-size="16" color="#94a3b8" margin-top="6" />
  </container>

  <!-- Stage Box 1520x650 -->
  <container position="absolute" x="200" y="250" width="1520" height="650" background="#10161f" border-radius="24" border="1px solid #475569" padding="40" position="relative">
    
    <!-- SVG Baseline -->
    <svg x="0" y="0" width="1440" height="570" viewBox="0 0 1440 570" fill="none">
      <!-- Horizontal baseline -->
      <path d="M 60 480 L 1380 480" stroke="#475569" stroke-width="3" stroke-linecap="round" />
      
      <!-- Grid ticks -->
      <path d="M 60 360 L 1380 360" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />
      <path d="M 60 240 L 1380 240" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />
      <path d="M 60 120 L 1380 120" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />
    </svg>

    <!-- 4 Bar Columns: Q1 (12%), Q2 (28%), Q3 (45%), Q4 (64% - Emphasized Accent) -->
    
    <!-- Bar 1: Q1 (12% -> 60px) -->
    <container position="absolute" x="180" y="80" width="160" height="480" justify-content="flex_end" align-items="center">
      <container width="160" height="70" background="#334155" border-radius="12">
        <animate property="height" from="0" to="70" start="0.4" end="1.2" easing="ease_out" />
      </container>
      <text margin-top="16" font-size="18" font-weight="600" color="#94a3b8">Q1 (12%)</text>
    </container>

    <!-- Bar 2: Q2 (28% -> 150px) -->
    <container position="absolute" x="480" y="80" width="160" height="480" justify-content="flex_end" align-items="center">
      <container width="160" height="160" background="#334155" border-radius="12">
        <animate property="height" from="0" to="160" start="0.6" end="1.4" easing="ease_out" />
      </container>
      <text margin-top="16" font-size="18" font-weight="600" color="#94a3b8">Q2 (28%)</text>
    </container>

    <!-- Bar 3: Q3 (45% -> 260px) -->
    <container position="absolute" x="780" y="80" width="160" height="480" justify-content="flex_end" align-items="center">
      <container width="160" height="260" background="#334155" border-radius="12">
        <animate property="height" from="0" to="260" start="0.8" end="1.6" easing="ease_out" />
      </container>
      <text margin-top="16" font-size="18" font-weight="600" color="#94a3b8">Q3 (45%)</text>
    </container>

    <!-- Bar 4: Q4 (64% -> 370px) - Accent Green #71f5a7 with Emphasized Callout -->
    <container position="absolute" x="1080" y="80" width="160" height="480" justify-content="flex_end" align-items="center">
      <!-- Callout Chip positioned above bar -->
      <container width="140" height="52" background="#71f5a7" border-radius="12" justify-content="center" align-items="center" margin-bottom="16" opacity="0.0">
        <animate property="opacity" from="0.0" to="1.0" start="1.8" end="2.2" easing="ease_out" />
        <animate property="scale" from="0.7" to="1.0" start="1.8" end="2.2" easing="back_out" />
        <text font-size="24" font-weight="700" color="#05070b">+64%</text>
      </container>

      <!-- Bar Column -->
      <container width="160" height="370" background="#71f5a7" border-radius="12">
        <animate property="height" from="0" to="370" start="1.0" end="1.8" easing="ease_out" />
      </container>
      <text margin-top="16" font-size="20" font-weight="700" color="#71f5a7">Q4 (Peak)</text>
    </container>

  </container>

  <!-- Footer Info -->
  <container position="absolute" x="200" y="960" layout="row" align-items="center" gap="12">
    <circle r="5" fill="#71f5a7" />
    <text text="Exact HyperFrames chart-story parameters: envelope IN_BASE 3.3s, staggered bar scale, accent chip pop & settle." font-size="16" color="#64748b" />
  </container>
</scene>
